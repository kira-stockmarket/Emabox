name: Breakout Strategy Optimization Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      # Updated to v4
      - name: Checkout repository
        uses: actions/checkout@v4

      # Updated to v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download & Cache Market Data
        run: python data_loader.py

      - name: Run ML Optimization (30 minutes)
        run: python optimize.py

      - name: Generate Final Strategy Results
        run: python backtest.py

      # Updated to v4 (This fixes your error)
      - name: Upload Backtest Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strategy-results
          path: |
            trades.csv
            stats.txt
            comparison.png
            config.yaml
