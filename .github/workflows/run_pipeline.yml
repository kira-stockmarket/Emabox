name: Deep Walk-Forward Optimization Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Explicitly sets max job time to 6 hours (safe for 5.8h run)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download & Cache Market Data (Max History)
        run: python data_loader.py

      - name: Run Deep Walk-Forward ML Optimization (5.8 Hours)
        run: python walk_forward.py

      - name: Upload Backtest Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strategy-results
          path: |
            trades.csv
            stats.txt
            comparison.png
            config.yaml
